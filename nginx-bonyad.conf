server {
    listen 80;
    listen [::]:80;
    server_name www.bonyad-hub.com bonyad-hub.com;

    root /var/www/bonyad-hub;
    
    # API proxy (backend on same server or different port)
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin panel (if applicable)
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Bonyad app subdirectory
    location /app/ {
        alias /var/www/bonyad-hub/app/;
        try_files $uri $uri/ /app/index.html;
        
        # Security: Set proper MIME types for JS files
        location ~* \.js$ {
            add_header Content-Type "application/javascript; charset=utf-8";
        }
        
        # Security: Set proper MIME types for JSON files
        location ~* \.json$ {
            add_header Content-Type "application/json; charset=utf-8";
        }
        
        # Fonts
        location ~* \.woff2?$ {
            add_header Content-Type "font/woff2";
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Static assets with proper MIME types
    location ~* /app/_expo/ {
        alias /var/www/bonyad-hub/app/_expo/;
        
        # Critical: Fix MIME type for JS files
        location ~* \.js$ {
            add_header Content-Type "application/javascript; charset=utf-8";
        }
        
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* /app/assets/ {
        alias /var/www/bonyad-hub/app/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compress files
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/xml+rss 
               application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

